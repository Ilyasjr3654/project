documents:
  - name: clients_commandes
    left: clients.client_id
    right: commandes.client_id
    cardinality: Un client possède plusieurs commandes.
    tables: [clients, commandes]

  - name: commandes_lignes
    left: commandes.commande_id
    right: lignes_commandes.commande_id
